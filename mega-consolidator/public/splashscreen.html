<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading</title>
  <style>
    :root {
      --bg: #0f172a;
      --primary: #3b82f6;
      --text: #f8fafc;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .splash-container {
      width: 320px;
      height: 200px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .title {
      color: var(--text);
      font-weight: 600;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
    }
    
    .subtitle {
      color: #94a3b8;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img src="/CombinatorIcon.png" alt="Logo" style="width: 48px; height: 48px; object-fit: contain;" />
    <div class="spinner"></div>
    <div style="text-align: center;">
      <div class="title">MegaConsolidator</div>
      <div class="subtitle">Initializing core engine...</div>
    </div>
  </div>
</body>
</html>
